<style>
:root{--bg:#f5f2ec;--card:#fff;--ink:#17171c;--mut:#7a766d;--line:#e8e3d9;--red:#b3202a;--red2:#8e1620;--gold:#b08a3e;--ok:#1f7a4d;--okbg:#e3f3ea;--bad:#b3202a;--badbg:#fbe6e7;--sh:0 1px 2px rgba(20,18,12,.04),0 8px 24px rgba(20,18,12,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--card:#17171c;--ink:#f1eee8;--mut:#98948b;--line:#272730;--red:#e0424c;--red2:#b3202a;--gold:#d4ad5f;--ok:#4fcf90;--okbg:#14301f;--bad:#ff7a82;--badbg:#3a1a1d;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e0e11;--card:#17171c;--ink:#f1eee8;--mut:#98948b;--line:#272730;--red:#e0424c;--red2:#b3202a;--gold:#d4ad5f;--ok:#4fcf90;--okbg:#14301f;--bad:#ff7a82;--badbg:#3a1a1d;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:980px;margin:0 auto;padding:0 18px 120px}
header{padding:20px 2px 6px;display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;margin:0;line-height:1.05;letter-spacing:.01em}
.sub{color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-bottom:3px}
.ph{margin:18px 2px 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ph h2{font-family:'Cormorant Garamond',serif;font-size:32px;margin:0;line-height:1}
.ph p{margin:6px 0 0;color:var(--mut);font-size:13.5px}
h2{font-family:'Cormorant Garamond',serif;font-size:22px;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#17171d 0%,#2b0f13 100%);color:#f4efe6;border:0;padding:24px}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;border:28px solid rgba(176,138,62,.18)}
.hero .l{color:#cbb98f;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.big{font-size:36px;font-weight:600;margin:8px 0 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}.grid{margin-bottom:14px}
.stat .l{color:var(--mut);font-size:12px;font-weight:500}.stat .v{font-size:20px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:default}
.row[onclick]{cursor:pointer}.row:last-child{border:0;padding-bottom:0}.row:first-child{padding-top:0}
.grow{flex:1;min-width:0}
.t{font-weight:500}.m{color:var(--mut);font-size:12.5px;margin-top:2px}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(176,138,62,.18),rgba(179,32,42,.12));display:grid;place-items:center;font-weight:600;color:var(--gold);flex:none}
.badge{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:99px;white-space:nowrap;background:var(--bg);color:var(--mut)}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}
.in{color:var(--ok)}.out{color:var(--bad)}
button,input,select{font:inherit;color:inherit}
.btn{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(179,32,42,.22)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.s{padding:8px 13px;font-size:13px;border-radius:10px}.btn.w{width:100%}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:12px;outline:0}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,138,62,.18)}
label{font-size:11.5px;font-weight:600;color:var(--mut);display:block;margin:0 0 5px 2px;letter-spacing:.04em;text-transform:uppercase}
.bar{display:flex;align-items:flex-end;gap:12px;height:130px;margin-top:6px}
.bar div{flex:1;text-align:center;font-size:11.5px;color:var(--mut)}
.bar i{display:block;background:linear-gradient(var(--gold),var(--red));border-radius:8px 8px 0 0;margin-bottom:6px;min-height:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;max-width:640px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:10.5px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--red);font-weight:600}
.bar-top{margin-bottom:14px}.bar-top input{margin:0}
.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;z-index:4}
.ov{position:fixed;inset:0;background:rgba(10,10,14,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;z-index:20}
.empty{color:var(--mut);text-align:center;padding:26px 0}
.pill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);cursor:pointer;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#aaa;flex:none}.dot.on{background:#2fbf71;box-shadow:0 0 0 4px rgba(47,191,113,.2)}.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.seg button{white-space:nowrap}table.sx{border-collapse:collapse;width:100%;font-size:13px}table.sx th{background:var(--bg);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--mut);position:sticky;top:0}table.sx td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
@media (min-width:900px){
 body{padding-left:240px}
 nav{top:0;right:auto;bottom:0;width:240px;border-top:0;border-right:1px solid var(--line);padding:96px 14px 20px}
 nav div{flex-direction:column;gap:4px;max-width:none}
 nav button{flex:none;flex-direction:row;font-size:14px;padding:12px 16px;border-radius:12px;gap:12px}
 nav .on{background:var(--badbg)}
 .grid{grid-template-columns:repeat(4,1fr)}.grid.g2{grid-template-columns:repeat(3,1fr)}
 .fab{bottom:28px;right:32px;width:auto;border-radius:14px;padding:0 22px;font-size:15px}
 .sheet{border-radius:24px;margin:auto}.ov{align-items:center}
 .logo+div{}
}
</style>

<script>
const KEY='kkc_v1',SABUK=['Putih','Kuning','Oranye','Hijau','Biru','Coklat','Hitam'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const KAT_IN=['Uang Pendaftaran','Ujian Kenaikan Sabuk','Donasi','Lainnya'];
const KAT_OUT=['Sewa Tempat','Honor Pelatih','Perlengkapan','Event/Turnamen','Konsumsi','Lainnya'];
let tab='home',q='',bulan=ym(new Date());
let S=load();
function uid(){return Math.random().toString(36).slice(2,9)}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){return new Date().toISOString().slice(0,10)}
function rp(n){return 'Rp '+Math.round(n||0).toLocaleString('id-ID')}
function bl(k){const[y,m]=k.split('-');return BLN[m-1]+' '+y}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function demo(){const m=ym(new Date());return{members:[
{id:'a1',nama:'Raka Pratama',sabuk:'Hijau',telp:'081234567801',iuran:50000,aktif:true},
{id:'a2',nama:'Dewi Anjani',sabuk:'Biru',telp:'081234567802',iuran:50000,aktif:true},
{id:'a3',nama:'Bima Saputra',sabuk:'Kuning',telp:'081234567803',iuran:50000,aktif:true}],
pays:[{id:'p1',mid:'a1',bulan:m,jumlah:50000,tgl:today(),metode:'Tunai'}],
kas:[{id:'k1',tgl:today(),tipe:'out',kat:'Sewa Tempat',ket:'Sewa aula bulanan',jumlah:150000}]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return mig(JSON.parse(r))}catch(e){}return mig(demo())}
function mig(s){s.reg=s.reg||[];s.cfg=s.cfg||{regFee:250000};if(!s.cfg.iuran){s.cfg.iuran=50000;s.members.forEach(m=>m.iuran=50000)}return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function mem(id){return S.members.find(m=>m.id===id)}
function ledger(){return[...S.pays.map(p=>({id:p.id,tgl:p.tgl,tipe:'in',kat:'Iuran Bulanan',ket:(mem(p.mid)?.nama||'?')+' – '+bl(p.bulan),jumlah:p.jumlah,auto:1})),...S.reg.filter(r=>r.bayar>0).map(r=>({id:r.id,tgl:r.tgl,tipe:'in',kat:'Biaya Pendaftaran',ket:r.nama+' – pendaftaran',jumlah:r.bayar,auto:1})),...S.kas].sort((a,b)=>b.tgl.localeCompare(a.tgl))}
function paid(mid,b){return S.pays.find(p=>p.mid===mid&&p.bulan===b)}
function sum(l,t,pre){return l.filter(x=>x.tipe===t&&(!pre||x.tgl.startsWith(pre))).reduce((a,x)=>a+x.jumlah,0)}

function go(t){tab=t;q='';render();scrollTo(0,0)}
function fabAct(){({mem:fMem,reg:fReg,kas:fKas})[tab]()}

function vHome(){

  y=doc.lastAutoTable.finalY+10;if(y>235){doc.addPage();y=20}
  sec('3. Rincian Transaksi',y);

  y=doc.lastAutoTable.finalY+14;if(y>240){doc.addPage();y=24}

  doc.text('(..............................)',45,y+34,{align:'center'});doc.text('(..............................)',W-45,y+34,{align:'center'});
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(130);doc.text('Kejeksan Karate Club  |  Hal. '+i+'/'+n,W/2,290,{align:'center'})}
  try{const d=await claude.use('downloads');if(!d)return toast('Unduhan tidak tersedia di tampilan ini');await d.save({filename:'Laporan-KKC-'+b+'.pdf',data:doc.output('arraybuffer')});toast('Laporan siap disimpan')}catch(e){if(e&&e.code!=='declined')toast('Gagal membuat PDF')}}
function sheets(){return{
Anggota:S.members.map(m=>({Nama:m.nama,Sabuk:m.sabuk,Telepon:m.telp,'Iuran/Bulan':m.iuran,Status:m.aktif?'Aktif':'Nonaktif'})),
Pendaftaran:S.reg.map(r=>({Tanggal:r.tgl,Nama:r.nama,Telepon:r.telp,Tarif:r.tarif,Dibayar:r.bayar,Kekurangan:r.tarif-r.bayar,Metode:r.metode})),
Iuran:S.pays.map(p=>({Tanggal:p.tgl,Anggota:mem(p.mid)?.nama||'?',Bulan:p.bulan,Jumlah:p.jumlah,Metode:p.metode})),
Kas:ledger().reverse().map(x=>({Tanggal:x.tgl,Tipe:x.tipe==='in'?'Pemasukan':'Pengeluaran',Kategori:x.kat,Keterangan:x.ket,Jumlah:x.jumlah}))}}
async function exportX(){
  if(!window.XLSX)return toast('Library Excel belum termuat');
  const wb=XLSX.utils.book_new(),s=sheets();
  for(const k in s)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s[k]),k);
  const data=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  try{const d=await claude.use('downloads');if(!d)return toast('Unduhan tidak tersedia di tampilan ini');await d.save({filename:'KKC-Keuangan-'+today()+'.xlsx',data});toast('File siap disimpan')}catch(e){if(e&&e.code!=='declined')toast('Gagal mengunduh')}}
async function copyTSV(name){const r=sheets()[name||'Kas'],h=Object.keys(r[0]||{Tanggal:1,Tipe:1,Kategori:1,Keterangan:1,Jumlah:1});
  const t=[h.join('\t'),...r.map(o=>h.map(k=>o[k]).join('\t'))].join('\n');
  try{await navigator.clipboard.writeText(t);toast('Tersalin – tempel di Google Sheets')}catch(e){toast('Salin diblokir; gunakan unduh .xlsx')}}
function importX(el){const f=el.files[0];if(!f||!window.XLSX||ro())return;const r=new FileReader();
  r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);let n=0;
    rows.forEach(o=>{const nama=o.Nama||o.nama;if(!nama)return;S.members.push({id:uid(),nama:String(nama),sabuk:SABUK.includes(o.Sabuk)?o.Sabuk:'Putih',telp:String(o.Telepon||o.telp||''),iuran:+(o.Iuran||o['Iuran/Bulan'])||S.cfg.iuran,aktif:true});n++});
    save();toast(n+' anggota diimpor');go('mem')}catch(err){toast('File tidak terbaca')}};r.readAsArrayBuffer(f)}

function vReg(){const now=ym(new Date()),R=S.reg,tot=R.reduce((a,r)=>a+r.bayar,0),kur=R.reduce((a,r)=>a+Math.max(0,r.tarif-r.bayar),0);

  <button class="btn w" onclick="sKas('${id||''}')">Simpan</button>${id?`<button class="btn g w" style="margin-top:8px;color:var(--bad)" onclick="S.kas=S.kas.filter(x=>x.id!=='${id}');save();closeM();render()">Hapus</button>`:''}`);catOpt(k.kat)}
function catOpt(sel){const l=v('f1')==='in'?KAT_IN:KAT_OUT;document.getElementById('f2').innerHTML=l.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('')}
function sKas(id){const j=+v('f4');if(!j)return toast('Isi jumlah');const o={tipe:v('f1'),kat:v('f2'),ket:v('f3'),jumlah:j,tgl:v('f5')||today()};
  if(id)Object.assign(S.kas.find(x=>x.id===id),o);else S.kas.push({id:uid(),...o});save();closeM();render()}
let CANW=true,DB=null,PEERS=1,LAST='',pt,sx='Anggota';const CID=uid();
const nowt=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function setPill(){const e=document.getElementById('ons');if(e)e.innerHTML=`<span class="dot ${DB?'on':''}"></span>${DB?'Online · '+PEERS:'Offline'}`}
function refreshOnline(){setPill();if(tab==='onl')render()}
function push(){clearTimeout(pt);pt=setTimeout(async()=>{if(!DB)return;try{S._t=Date.now();await DB.doc('kkc/state').set({json:JSON.stringify(S),t:S._t,by:CID});LAST=nowt();refreshOnline()}catch(e){toast('Gagal sinkron (akses hanya-lihat atau offline)')}},500)}
function tbl(r){if(!r.length)return'<div class="empty">Belum ada data</div>';const h=Object.keys(r[0]);return`<table class="sx"><tr>${h.map(k=>`<th>${k}</th>`).join('')}</tr>${r.map(o=>`<tr>${h.map(k=>`<td ${typeof o[k]==='number'?'style="text-align:right"':''}>${typeof o[k]==='number'?o[k].toLocaleString('id-ID'):esc(o[k])}</td>`).join('')}</tr>`).join('')}</table>`}
function vOnl(){return`<div class="card"><div class="row"><span class="dot ${DB?'on':''}"></span><div class="grow"><div class="t">${DB?'Tersambung – data tersinkron realtime':'Offline – data hanya di perangkat ini'}</div><div class="m">${DB?PEERS+' perangkat sedang membuka aplikasi · sinkron terakhir '+(LAST||'-'):'Buka lewat tautan claude.ai dan masuk akun untuk mengaktifkan sinkronisasi'}</div></div>${DB?'<button class="btn g s" onclick="push()">Sinkron</button>':''}</div><div style="margin-top:12px"><span class="badge ${CANW?'ok':'bad'}">${CANW?'Akses Anda: bisa mengedit':'Akses Anda: hanya lihat'}</span></div><div class="m" style="margin-top:12px">Untuk menambah pengurus: bagikan aplikasi dari claude.ai, beri akses <b>Contributor</b> untuk bendahara/pengurus yang boleh mengedit, dan <b>Viewer</b> untuk yang hanya boleh melihat. Perubahan di satu perangkat langsung muncul di perangkat lain. Bila dua orang mengedit bersamaan, perubahan terakhir yang dipakai.</div></div>
<h2>Spreadsheet Langsung</h2><div class="seg">${['Anggota','Pendaftaran','Iuran','Kas'].map(n=>`<button class="btn s ${sx===n?'':'g'}" onclick="sx='${n}';render()">${n}</button>`).join('')}</div>
<div class="card" style="padding:0"><div style="max-height:420px;overflow:auto">${tbl(sheets()[sx])}</div></div>
<div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn g" onclick="copyTSV(sx)">⧉ Salin ke Google Sheets</button><button class="btn" onclick="exportX()">⇩ Unduh .xlsx</button></div>`}
render();
(async()=>{try{if(typeof claude==='undefined')return;DB=await claude.use('db');try{const U=await claude.use('user');if(U&&(await U.can('data.write'))===false){CANW=false;render()}}catch(e){}
 if(DB)DB.doc('kkc/state').onSnapshot(snap=>{if(!snap.exists){push();refreshOnline();return}const d=snap.data();
  if(d.by!==CID&&d.t>(S._t||0)){try{S=mig(JSON.parse(d.json));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}LAST=nowt();render()}catch(e){}}refreshOnline()},()=>{});
 const R=await claude.use('room');if(R)R.onPeers(c=>{PEERS=c.peers.length||1;refreshOnline()});
 refreshOnline()}catch(e){}})();
</script>
</body>
